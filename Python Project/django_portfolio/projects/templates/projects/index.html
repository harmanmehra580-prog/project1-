<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center fw-bold mb-5">My Portfolio Projects</h1>
        <div class="row row-cols-1 row-cols-md-3 g-4"> {% for project in projects %} <div class="col">
                <div class="card h-100 shadow-sm"> {% if project.image %} <img src="{{ project.image.url }}"
                        class="card-img-top" alt="{{ project.title }}" style="height: 200px; object-fit: cover;"> {%
                    endif %} <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold">{{ project.title }}</h5>
                        <p class="card-text text-muted">{{ project.description }}</p>
                        <div class="mt-auto"> <span class="badge bg-dark mb-3">{{ project.technology }}</span> {% if
                            project.github_link %} <a href="{{ project.github_link }}"
                                class="btn btn-outline-primary d-block" target="_blank">View Repository</a> {% endif %}
                        </div>
                    </div>
                </div>
            </div> {% empty %} <div class="col-12 text-center">
                <p class="text-muted fs-5">No projects uploaded yet. Check back soon!</p>
            </div> {% endfor %} </div>
    </div>
</body>

</html>
